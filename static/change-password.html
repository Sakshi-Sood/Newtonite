<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose your password · Newtonite Ops</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/style.css">
</head>
<body data-page="change-password">
  <main class="narrow">
    <h1>Choose your own password</h1>
    <p class="muted">You're signed in with a temporary password from an admin. Pick a password only you know to continue.</p>
    <form id="password-form" class="card stack" hidden>
      <label>Temporary password <input name="current_password" type="password" autocomplete="current-password" required autofocus></label>
      <label>New password <input name="new_password" type="password" minlength="8" maxlength="200" autocomplete="new-password" required>
        <span class="hint">At least 8 characters, and different from the temporary one.</span></label>
      <label>Confirm new password <input name="confirm" type="password" autocomplete="new-password" required></label>
      <p id="password-error" class="error" hidden></p>
      <div class="row">
        <button type="submit" class="primary">Save password</button>
        <button type="button" id="logout-btn">Sign out</button>
      </div>
    </form>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
