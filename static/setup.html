<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set up · Newtonite Ops</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/style.css">
</head>
<body data-page="setup">
  <main class="narrow">
    <h1>Welcome to Newtonite Ops</h1>
    <p class="muted">There are no accounts yet. Create the first admin: they will create teams and add everyone else.
      This page only appears once.</p>
    <form id="setup-form" class="card stack" hidden>
      <label>Full name <input name="name" autocomplete="name" maxlength="100" required autofocus></label>
      <label>Email <input name="email" type="email" autocomplete="username" maxlength="254" required></label>
      <label>Password <input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="200" required>
        <span class="hint">At least 8 characters.</span></label>
      <label>Confirm password <input name="confirm" type="password" autocomplete="new-password" required></label>
      <p id="setup-error" class="error" hidden></p>
      <button type="submit" class="primary">Create admin account</button>
    </form>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
